services:
  postgres:
    image: postgres:16
    container_name: piggybank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: piggybank
      POSTGRES_PASSWORD: piggybank_password
      POSTGRES_DB: piggybank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: